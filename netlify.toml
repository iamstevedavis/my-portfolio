[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.19.0"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
  from = "https://visda.netlify.app/*"
  to = "https://visda.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://visda.netlify.app/*"
  to = "https://visda.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--visda.netlify.app/*"
  to = "https://visda.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://main--visda.netlify.app/*"
  to = "https://visda.ca/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
